default:
  target: dev
  outputs:
    dev:
      type: tidb
      server: [server/host]
      port: [port]  # optional
      database: [schema] # optional, should be same as schema
      schema: [schema]
      username: [username]
      password: [password]
      # TLS and server certificate/hostname verification are enabled by default.
      # ssl_ca: /path/to/ca.pem
      # Only for a trusted local development server without TLS:
      # ssl_verify_cert: false
      # ssl_verify_identity: false
      driver: MySQL ODBC 8.0 ANSI Driver
    prod:
      type: tidb
      server: [server/host]
      port: [port]  # optional
      database: [schema] # optional, should be same as schema
      schema: [schema]
      username: [username]
      password: [password]
      # Use a CA file if the server certificate is not trusted by the system.
      # ssl_ca: /path/to/ca.pem
      driver: MySQL ODBC 8.0 ANSI Driver
