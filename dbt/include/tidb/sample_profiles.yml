default:
  target: dev
  outputs:
    dev:
      type: tidb
      server: [server/host]
      port: [port]  # optional
      database: [schema] # optional, should be same as schema
      schema: [schema]
      username: [username]
      password: [password]
      # For remote connections, enable server certificate and hostname verification:
      # ssl_ca: /path/to/ca.pem
      # ssl_verify_cert: true
      # ssl_verify_identity: true
      driver: MySQL ODBC 8.0 ANSI Driver
    prod:
      type: tidb
      server: [server/host]
      port: [port]  # optional
      database: [schema] # optional, should be same as schema
      schema: [schema]
      username: [username]
      password: [password]
      driver: MySQL ODBC 8.0 ANSI Driver
